<nav class="w-full bg-white border-b border-gray-100 py-3 px-3 sm:px-6 flex items-center justify-between shadow-sm sticky top-0 z-40">

  <div class="container flex items-center justify-between mx-auto">
    
    <!-- الشعار والاسم (يسار الناف بار) -->
    <div class="flex items-center gap-3">
      <img alt="Route Posts" class="h-9 w-9 rounded-xl object-cover" src="/imgs/route.png">
      <p class="hidden text-xl font-extrabold text-slate-900 sm:block">Route Posts</p>
    </div>

    <!-- روابط التنقل الرئيسية (المنتصف - تظهر الأيقونات فقط في الموبايل وتظهر النصوص في الشاشات الأكبر) -->
    <div class="flex items-center gap-1 bg-slate-50/80 p-1.5 rounded-2xl border border-slate-100">

      <!-- رابط Feed -->
      <a routerLink="/feed" routerLinkActive="bg-white text-blue-600 shadow-sm"
        [routerLinkActiveOptions]="{exact: true}"
        class="flex items-center justify-center sm:gap-2 px-3 sm:px-5 py-2 rounded-xl font-semibold text-sm text-slate-600 transition-all hover:text-slate-900">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-4 sm:h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span class="hidden sm:inline">Feed</span>
      </a>

      <!-- رابط Profile -->
      <a routerLink="/profile" routerLinkActive="bg-white text-blue-600 shadow-sm"
        class="flex items-center justify-center sm:gap-2 px-3 sm:px-5 py-2 rounded-xl font-semibold text-sm text-slate-600 transition-all hover:text-slate-900">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-4 sm:h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span class="hidden sm:inline">Profile</span>
      </a>

      <!-- رابط Notifications -->
      <a routerLink="/notification" routerLinkActive="bg-white text-[#1f6fe5]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="relative flex items-center justify-center rounded-xl px-3 sm:px-3.5 py-2 text-sm font-extrabold text-slate-600 transition hover:bg-white hover:text-[#1f6fe5]">
        <span class="relative shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719" />
          </svg>

         @if (unReadNofications() > 0) {
  <span
    class="absolute -right-2 -top-2 inline-flex min-w-[16px] items-center justify-center rounded-full bg-[#ef4444] px-1 text-[10px] font-black leading-4 text-white">
    {{ unReadNofications() > 99 ? '99+' : unReadNofications() }}
  </span>
}
        </span>

        <span class="hidden sm:inline ml-1.5 sm:ml-2">Notifications</span>
      </a>
    </div>

    <!-- الجزء الخاص بالبروفايل والإعدادات (يمين الناف بار) -->
    <div class="relative">
      <button (click)="toggleDropdown()" type="button"
        class="flex items-center gap-2 sm:gap-3 bg-slate-50 border border-slate-200/80 rounded-full py-1.5 px-2 sm:px-3 hover:bg-slate-100 transition-colors focus:outline-none">
        <img [src]="myPhoto()" alt="Avatar" class="w-8 h-8 rounded-full object-cover">
        <span class="text-sm font-semibold text-slate-800 hidden sm:inline-block">{{userData().name}}</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <!-- قائمة الإعدادات Dropdown Menu -->
      <div *ngIf="isMenuOpen" (clickOutside)="closeDropdown()"
        class="absolute right-0 z-50 mt-2 w-52 rounded-xl border border-slate-200 bg-white p-2 shadow-lg animate-in fade-in slide-in-from-top-2 duration-150">

        <button routerLink="/profile" (click)="closeDropdown()"
          class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-user" aria-hidden="true">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Profile
        </button>

        <button routerLink="/settings" (click)="closeDropdown()"
          class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-settings" aria-hidden="true">
            <path
              d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915">
            </path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          Settings
        </button>

        <div class="my-1 border-t border-slate-200"></div>

        <button (click)="logout()"
          class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold text-rose-600 hover:bg-rose-50">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </button>
      </div>
    </div>
  </div>

</nav>
