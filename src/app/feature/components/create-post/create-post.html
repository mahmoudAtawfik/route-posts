<div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm mb-3">
  <!-- Top: User Info & Privacy -->
  <div class="mb-3 flex items-center gap-3">
    <img
      [src]="myPhoto() || 'https://pub-3cba56bacf9f4965bbb0989e07dada12.r2.dev/linkedPosts/default-profile.png'"
      [alt]="userData()?.name || 'User'" class="h-11 w-11 rounded-full object-cover border border-slate-100" />
    <div>
      <p class="text-base font-bold text-slate-900 leading-tight">
        {{ userData()?.name || 'Nicole' }}
      </p>
      <div
        class="mt-1 inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-700 cursor-pointer hover:bg-slate-200 transition">
        <!-- Globe Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-600">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>

        <div class="relative inline-flex items-center">
          <select [(ngModel)]="privacy"
            class="appearance-none border-0 outline-none ring-0 focus:border-0 focus:outline-none focus:ring-0 bg-transparent pr-4 text-xs font-semibold text-slate-700 cursor-pointer">
            <option value="public">Public</option>
            <option value="followers">Followers</option>
            <option value="only_me">Only me</option>
          </select>

        </div>
      </div>
    </div>
  </div>

  <!-- Middle: Textarea Container -->
  <div
    class="rounded-2xl border border-slate-200 bg-white p-3.5 transition focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-100/60">
    <textarea [(ngModel)]="content" [placeholder]="'What\'s on your mind, ' + (firstName() || 'Nicole') + '?'" rows="3"
      class="w-full resize-none border-none bg-transparent p-0 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-0"></textarea>

    <!-- Selected Image Preview -->
    @if (imagePreview()) {
    <div class="relative mt-3 rounded-xl overflow-hidden border border-slate-200">
      <img [src]="imagePreview()" alt="Selected Preview" class="max-h-60 w-full object-cover" />
      <button type="button" (click)="removeImage()"
        class="absolute top-2 right-2 flex h-7 w-7 items-center justify-center rounded-full bg-slate-900/70 text-white hover:bg-slate-900 transition"
        title="Remove photo">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    }
  </div>

  <!-- Divider -->
  <hr class="border-t border-slate-200 my-3" />

  <!-- Bottom: Actions & Post Button -->
  <div class="flex items-center justify-between">
    <!-- Left Actions -->
    <div class="flex items-center gap-1 sm:gap-2">
      <!-- Hidden File Input -->
      <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden" />

      <!-- Photo / Video Button -->
      <button type="button" (click)="fileInput.click()"
        class="inline-flex items-center gap-2 rounded-xl px-2.5 py-1.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 transition cursor-pointer">
        <!-- Green Photo Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#059669"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
          <circle cx="9" cy="9" r="2" />
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
        </svg>
        <span class="text-xs sm:text-sm">Photo/video</span>
      </button>

      <!-- Feeling / Activity Button -->
      <button type="button"
        class="inline-flex items-center gap-2 rounded-xl px-2.5 py-1.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 transition cursor-pointer">
        <!-- Orange Smiley Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="M8 14s1.5 2 4 2 4-2 4-2" />
          <line x1="9" y1="9" x2="9.01" y2="9" />
          <line x1="15" y1="15.01" x2="15" y2="9" />
        </svg>
        <span class="text-xs sm:text-sm">Feeling/activity</span>
      </button>
    </div>

    <!-- Right: Post Button -->
    <button type="button" (click)="submitPost()" [disabled]="isSubmitDisabled()"
      class="inline-flex items-center gap-2 rounded-xl bg-[#599bf5] hover:bg-[#468df0] px-5 py-2 text-sm font-bold text-white transition shadow-sm disabled:cursor-not-allowed disabled:opacity-50">
      @if (isLoading()) {
      <svg class="h-4 w-4 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      <span>Posting...</span>
      } @else {
      <span>Post</span>
      <!-- Paper Plane Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="-rotate-12 translate-y-[1px]">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
      }
    </button>
  </div>

  <!-- Error feedback if any -->
  @if (errorMessage()) {
  <div class="mt-2 text-xs text-red-500 font-medium">
    {{ errorMessage() }}
  </div>
  }
</div>
