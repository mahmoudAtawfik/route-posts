<div class="flex min-h-[80vh] items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
  <div class="w-full max-w-md text-center">
    
    <!-- Illustration / Icon Container -->
    <div class="relative mx-auto mb-6 flex h-28 w-28 items-center justify-center rounded-3xl bg-blue-50 border border-blue-100 shadow-sm sm:h-32 sm:w-32 dark:bg-blue-950/40 dark:border-blue-900/50">
      <div class="absolute inset-0 rounded-3xl bg-blue-400/10 blur-xl"></div>
      <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
        class="relative text-[#1877f2] sm:w-16 sm:h-16">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M16 16s-1.5-2-4-2-4 2-4 2"></path>
        <line x1="9" y1="9" x2="9.01" y2="9"></line>
        <line x1="15" y1="9" x2="15.01" y2="9"></line>
      </svg>
    </div>

    <!-- Error Code & Title -->
    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 border border-blue-100 text-xs font-bold text-[#1877f2] dark:bg-blue-950/40 dark:border-blue-900/50 dark:text-blue-400 mb-3">
      Error 404
    </span>
    
    <h1 class="text-2xl font-black text-slate-900 sm:text-3xl tracking-tight dark:text-slate-100">
      Page not found
    </h1>
    
    <p class="mt-2 text-sm text-slate-500 sm:text-base dark:text-slate-400">
      Sorry, we couldn’t find the page you’re looking for. It might have been removed or the link might be broken.
    </p>

    <!-- Action Buttons -->
    <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
      <!-- Go Back Home / Feed -->
      <a routerLink="/feed"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl bg-[#1877f2] px-6 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-[#166fe5]">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Back to Feed
      </a>

      <!-- Go Back / Previous Page -->
      <button type="button" (click)="goBack()"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl border border-slate-300 bg-white px-6 py-3 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-slate-50 dark:bg-slate-900 dark:border-slate-800 dark:text-slate-200 dark:hover:bg-slate-800">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Go back
      </button>
    </div>

  </div>
</div>
