<div
  (click)="onClose()"
  class="fixed inset-0 z-[70] flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 transition-opacity">
  
  <div
    (click)="$event.stopPropagation()"
    class="w-full max-w-[440px] rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 px-5 py-4">
      <div class="flex items-center gap-2.5">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="text-[#1877f2] shrink-0">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <h3 class="text-base font-bold text-slate-900 dark:text-slate-100 tracking-tight">
          People who reacted
        </h3>
      </div>

      <button
        type="button"
        (click)="onClose()"
        title="Close dialog"
        class="inline-flex h-8 w-8 items-center justify-center rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <!-- Body: Reacted Users List -->
    <div class="p-3 sm:p-4 max-h-[60vh] overflow-y-auto space-y-1">
      @if (isLoading()) {
        <div class="flex items-center justify-center py-10 text-slate-400 text-sm gap-2">
          <i class="fa-solid fa-spinner fa-spin text-[#1877f2]"></i>
          <span>Loading reactions...</span>
        </div>
      } @else if (errorMessage()) {
        <div class="text-center py-8 text-rose-500 text-xs">
          {{ errorMessage() }}
        </div>
      } @else {
        @for (user of usersList(); track user._id || user.username) {
          <div class="flex items-center gap-3.5 p-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/60 transition">
            <img
            [routerLink]="['/profile', user._id]"
              [src]="user.photo || defaultPhoto"
              [alt]="user.name"
              (error)="handleImageError($event)"
              class="w-10 h-10 rounded-full object-cover shrink-0 border border-slate-200/80 dark:border-slate-700 shadow-2xs"
            />
            <div class="min-w-0 flex-1">
              <h4
              [routerLink]="['/profile', user._id]"
               class="text-sm font-bold text-slate-900 dark:text-slate-100 truncate leading-snug hover:underline cursor-pointer">
                {{ user.name }}
              </h4>
              <p class="text-xs text-slate-500 dark:text-slate-400 truncate leading-tight">
                &#64;{{ user.username }}
              </p>
            </div>
          </div>
        } @empty {
          <div class="text-center py-10 text-slate-400 text-sm">
            No reactions yet.
          </div>
        }
      }
    </div>

  </div>
</div>
