@if (post()) {
  <!-- Modal Backdrop -->
  <div
    (click)="onClose()"
    class="fixed inset-0 z-[70] flex items-center justify-center bg-slate-900/65 backdrop-blur-[2px] p-4 transition-opacity">
    
    <!-- Modal Dialog Card -->
    <div
      (click)="$event.stopPropagation()"
      class="w-full max-w-[560px] rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-2xl overflow-hidden">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 px-5 py-3.5">
        <h4 class="text-base font-extrabold text-slate-900 dark:text-slate-100">Share post</h4>
        <button
          type="button"
          (click)="onClose()"
          title="Close dialog"
          class="inline-flex h-8 w-8 items-center justify-center rounded-full text-slate-500 hover:bg-slate-100 hover:text-slate-700 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200 transition cursor-pointer">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M18 6 6 18"></path>
            <path d="m6 6 12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="space-y-3.5 p-4 sm:p-5 max-h-[75vh] overflow-y-auto">
        <!-- Say something textarea -->
        <textarea
          [ngModel]="content()"
          (ngModelChange)="content.set($event)"
          placeholder="Say something about this..."
          rows="3"
          maxlength="500"
          class="w-full resize-none rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-3.5 py-2.5 text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-400 outline-none transition focus:border-[#1877f2] focus:ring-2 focus:ring-[#1877f2]/20"></textarea>

        <!-- Post Preview Card -->
        <div class="rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 p-3.5 space-y-2.5">
          <!-- Author Info -->
          <div class="flex items-center gap-2.5">
            <img
              [src]="authorPhoto()"
              [alt]="authorName()"
              (error)="handleImageError($event)"
              class="h-9 w-9 rounded-full object-cover shrink-0 border border-slate-200 dark:border-slate-700 shadow-2xs"
            />
            <div class="min-w-0">
              <p class="truncate text-sm font-bold text-slate-900 dark:text-slate-100 leading-tight">
                {{ authorName() }}
              </p>
              <p class="truncate text-xs font-semibold text-slate-500 dark:text-slate-400">
                &#64;{{ authorHandle() }}
              </p>
            </div>
          </div>

          <!-- Post Body -->
          @if (targetPost()?.body) {
            <p class="text-xs sm:text-sm text-slate-800 dark:text-slate-200 whitespace-pre-wrap leading-relaxed">
              {{ targetPost()?.body }}
            </p>
          }

          <!-- Post Image -->
          @if (targetPost()?.image) {
            <div class="overflow-hidden rounded-lg border border-slate-200/80 dark:border-slate-700">
              <img
                [src]="targetPost()?.image"
                alt="Post preview"
                class="max-h-[260px] w-full object-cover"
              />
            </div>
          }
        </div>

        <!-- Error Message -->
        @if (errorMessage()) {
          <p class="text-xs text-rose-500 flex items-center gap-1">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ errorMessage() }}</span>
          </p>
        }
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end gap-2.5 border-t border-slate-200 dark:border-slate-800 px-5 py-3">
        <button
          type="button"
          (click)="onClose()"
          class="rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-5 py-2 text-sm font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition cursor-pointer">
          Cancel
        </button>
        <button
          type="button"
          (click)="share()"
          [disabled]="isLoading()"
          class="inline-flex items-center gap-1.5 rounded-xl bg-[#1877f2] hover:bg-[#166fe5] px-5 py-2 text-sm font-bold text-white transition disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer shadow-xs">
          @if (isLoading()) {
            <i class="fa-solid fa-spinner fa-spin text-xs"></i>
          }
          <span>Share now</span>
        </button>
      </div>

    </div>
  </div>
}
