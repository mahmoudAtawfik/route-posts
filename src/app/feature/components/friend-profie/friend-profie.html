<div class="mx-auto max-w-6xl px-3 sm:px-4 py-4 sm:py-6 space-y-4">

  <!-- Back Button -->
  <button type="button" (click)="goBack()"
    class="inline-flex items-center gap-2 rounded-xl border border-slate-200/90 bg-white px-3.5 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm font-semibold text-slate-700 shadow-2xs hover:bg-slate-50 transition cursor-pointer dark:border-slate-800 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Back</span>
  </button>

  <!-- Share Post Modal -->
  <app-share-post [post]="sharingPost()" (close)="closeShareModal()" (postShared)="onPostShared()">
  </app-share-post>

  <!-- Friend Profile Header Card -->

  <section
    class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">

    <!-- Cover -->
    <div
      class="relative h-48 overflow-hidden bg-[linear-gradient(112deg,#0f172a_0%,#1e3a5f_36%,#2b5178_72%,#5f8fb8_100%)]">
      @if (friendUser()?.cover) {
      <img [src]="friendUser()?.cover" alt="Profile Cover" class="h-full w-full object-cover" />
      }
    </div>

    <!-- Profile Details -->
    <div class="relative -mt-14 px-3 pb-5 sm:px-5">

      <div
        class="flex flex-wrap items-end justify-between gap-4 rounded-2xl border border-white/70 bg-white/95 p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900/95">

        <!-- Avatar + Name + Username -->
        <div class="flex min-w-0 items-end gap-3">

          <img [src]="friendUser()?.photo || defaultAvatar" (error)="$any($event.target).src = defaultAvatar"
            [alt]="friendUser()?.name || 'User'"
            class="h-20 w-20 shrink-0 rounded-full border-4 border-white object-cover shadow-sm sm:h-24 sm:w-24" />

          <div class="min-w-0 pb-1">
            <p class="truncate text-xl font-black text-slate-900 sm:text-2xl dark:text-slate-100">
              {{ friendUser()?.name || 'User' }}
            </p>

            <p class="truncate text-sm font-semibold text-slate-500 sm:text-base dark:text-slate-400">
              &#64;{{ friendUser()?.username }}
            </p>
          </div>

        </div>

        <!-- Follow / Following Button -->
        <button type="button" (click)="toggleFollow()" [disabled]="isFollowLoading()" [class.bg-white]="isFollowing()"
          [class.border]="isFollowing()" [class.border-slate-200]="isFollowing()" [class.text-slate-700]="isFollowing()"
          [class.hover:bg-slate-50]="isFollowing()" [class.bg-[#1877f2]]="!isFollowing()"
          [class.text-white]="!isFollowing()" [class.hover:bg-[#166fe5]]="!isFollowing()"
          class="inline-flex w-full items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-extrabold transition cursor-pointer disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto">

          @if (isFollowLoading()) {
          <span class="h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"></span>
          } @else if (isFollowing()) {

          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>

          Following

          } @else {

          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <line x1="19" x2="19" y1="8" y2="14" />
            <line x1="22" x2="16" y1="11" y2="11" />
          </svg>

          Follow

          }
        </button>

      </div>
    </div>

  </section>

  <!-- Posts Section -->
  <div class="space-y-4">
    @if (isLoadingPosts()) {
    <div class="flex justify-center items-center py-16">
      <span class="h-9 w-9 animate-spin rounded-full border-3 border-blue-500 border-t-transparent"></span>
    </div>
    } @else {
    @for (post of userPosts(); track post._id) {
    <div class="w-full">
      <app-post-card-component [post]="post" [myId]="myId()" (like)="likePost($event)" (bookmark)="bookmarkPost($event)"
        (share)="openShareModal($event)">
      </app-post-card-component>
    </div>
    } @empty {
    <div
      class="rounded-2xl border border-slate-200/90 bg-white p-12 text-center text-slate-400 dark:border-slate-800 dark:bg-slate-900">
      <p class="text-sm font-medium">No posts available</p>
    </div>
    }
    }
  </div>

</div>
